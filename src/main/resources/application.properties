spring.application.name=livros-api
server.port=8080

# Arquivos .properties são lidos em ISO-8859-1; por isso o "á" é escrito como á.
app.name=Catálogo de Livros

# JSON estrito: o Mini Spring configurava o Jackson no DispatcherServlet; agora é configuração do Spring Boot.
# Campo desconhecido (ex.: "id" enviado pelo cliente) vira 400, em vez de ser ignorado.
spring.jackson.deserialization.fail-on-unknown-properties=true
# "{} {}" (conteúdo depois do JSON) vira 400.
spring.jackson.deserialization.fail-on-trailing-tokens=true
# null para campo int vira 400.
spring.jackson.deserialization.fail-on-null-for-primitives=true
# 1.5 ou "40" em campo inteiro viram 400 (sem conversão silenciosa).
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# Escuta apenas em localhost, como o Mini Spring fazia (connector.setHost("127.0.0.1")).
server.address=127.0.0.1
